name: temporary-work-graph-hmmm-regeneration

on:
  push:
    branches:
      - repair/nonempty-work-graph-hmmm-20261005

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: repair/nonempty-work-graph-hmmm-20261005
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v6
        with:
          node-version: "24.15.0"
      - name: Install pinned native-reader runtimes
        run: |
          python -m pip install -r msdmd/requirements.txt
          npm ci --ignore-scripts --prefix msdmd
      - name: Generate collection
        run: |
          rm .github/workflows/regenerate-work-graph-hmmm-push.yml
          python -m msdmd.collect --root . --repo The-Interdependency/skill-lib --snapshot-identity --import-path ./msdmd/collection --out skill-lib_msdmd.ts --strict
      - name: Commit generated projection only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skill-lib_msdmd.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(msdmd): regenerate collection"
          git push origin HEAD:repair/nonempty-work-graph-hmmm-20261005
