# Temporary read-only recovery job; removed from the final repair tree.
# Usage: run on isolated repair-branch pushes to obtain a pinned parser wheel.
name: msdmd-native-recovery
on:
  push:
    branches: [repair/msdmd-native-readers-20260928]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - name: Download pinned parser wheel without executing it
        run: python -m pip download --only-binary=:all: --no-deps docstring-parser==0.18.0 --dest "$RUNNER_TEMP/parser-wheel"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: msdmd-parser-wheel
          path: ${{ runner.temp }}/parser-wheel/
          retention-days: 3
          if-no-files-found: error
