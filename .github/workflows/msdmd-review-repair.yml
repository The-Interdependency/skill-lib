# Temporary exact-base review repair; removed after verified publication.
name: msdmd-review-repair
on:
  push:
    branches: [repair/msdmd-native-readers-20260928]
    paths: [.github/workflows/msdmd-review-repair.yml]
permissions:
  contents: write
jobs:
  repair-and-verify:
    if: github.repository == 'The-Interdependency/skill-lib' && github.ref == 'refs/heads/repair/msdmd-native-readers-20260928'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: '24.15.0'
      - name: Install pinned reader runtimes
        run: |
          python -m pip install -r msdmd/requirements.txt
          npm ci --ignore-scripts --prefix msdmd
      - name: Reproduce review cases and apply bounded corrections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          import sys
          from pathlib import Path
          base = '1728f37fd3b05d2c55cb3e41aedfdb33d9e126f1'
          temporary = '.github/workflows/msdmd-review-repair.yml'
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip() == base
          assert subprocess.check_output(['git', 'diff', '--name-only', base, 'HEAD'], text=True).splitlines() == [temporary]
          def replace(path, old, new):
              target = Path(path)
              text = target.read_text()
              assert text.count(old) == 1, (path, old)
              target.write_text(text.replace(old, new))
          test = Path('tests/test_native_review_regressions.py')
          assert not test.exists()
          test.write_text(r'''"""Reviewed regressions: python -m unittest tests.test_native_review_regressions."""
          import json
          from pathlib import Path
          import subprocess
          import tempfile
          import unittest
          from unittest.mock import patch

          from msdmd.collect import collect, collection_errors
          from msdmd.formats import parse_json, parse_yaml


          class NativeReviewRegressions(unittest.TestCase):
              def collection(self, files, **options):
                  with tempfile.TemporaryDirectory() as temp:
                      root = Path(temp)
                      for name, content in files.items():
                          target = root / name
                          target.parent.mkdir(parents=True, exist_ok=True)
                          target.write_bytes(content if isinstance(content, bytes) else content.encode())
                      return collect(root, 'fixture', source_commit='a' * 40, **options)

              def facts(self, result, namespace=None, kind=None):
                  return [f for f in result['facts'] if (namespace is None or f['convention']['namespace'] == namespace)
                          and (kind is None or f['kind'] == kind)]

              def test_missing_comment_parser_retains_uncertified_candidates_and_fails_closed(self):
                  source = '// === DOCS ===\n// id: rescued\n//   owner: team\n// === END DOCS ===\nexport const x = 1;\n'
                  with patch('msdmd.native_code.subprocess.run', side_effect=FileNotFoundError()):
                      result = self.collection({'a.ts': source})
                  self.assertTrue(collection_errors(result))
                  candidates = [d for d in result['diagnostics'] if d['code'] == 'supplemental_comment_extraction_unavailable']
                  self.assertTrue(candidates)
                  self.assertIn('rescued', json.dumps(candidates))
                  self.assertFalse(result['declarations'])

              def test_ambiguous_header_block_candidates_are_not_silent_success(self):
                  source = '// === DOCS ===\n// id: header_candidate\n// === END DOCS ===\nint x;\n'
                  result = self.collection({'a.h': source})
                  self.assertTrue(collection_errors(result))
                  self.assertIn('header_candidate', json.dumps(result['diagnostics']))
                  self.assertFalse(result['declarations'])

              def test_systemd_continuations_preserve_separators_and_skip_comments(self):
                  source = '[Service]\nExecStart=/bin/echo one' + chr(92) + '\n# skipped\n; skipped too\n  two\n'
                  result = self.collection({'a.service': source})
                  self.assertFalse(collection_errors(result))
                  directive = self.facts(result, 'systemd.unit', 'unit-directive')[0]
                  self.assertEqual('/bin/echo one two', directive['native']['value']['value'])
                  self.assertEqual(2, directive['source']['location']['start_line'])
                  self.assertEqual(5, directive['source']['location']['end_line'])

              def test_every_systemd_environment_assignment_is_redacted(self):
                  for value in ('A=1 API_TOKEN=DO_NOT_PUBLISH_a18 PASSWORD=DO_NOT_PUBLISH_b19 SAFE=ok',
                                '"A=a b" "API_TOKEN=DO_NOT_PUBLISH_c20 extra" SAFE=ok'):
                      with self.subTest(value=value):
                          result = self.collection({'a.service': '[Service]\nEnvironment = ' + value + '\n'})
                          self.assertFalse(collection_errors(result))
                          published = json.dumps(result)
                          self.assertNotIn('DO_NOT_PUBLISH', published)
                          self.assertIn('SAFE=ok', published)
                          self.assertIn('sensitive_fields_redacted', published)

              def test_unimplemented_environment_escaping_is_withheld_and_partial(self):
                  source = '[Service]\nEnvironment=A=1 API' + chr(92) + 'x5fTOKEN=DO_NOT_PUBLISH_d21\n'
                  result = self.collection({'a.service': source}, required_sources=['a.service'])
                  self.assertTrue(collection_errors(result))
                  self.assertNotIn('DO_NOT_PUBLISH', json.dumps(result))
                  self.assertIn('unsupported_systemd_environment_syntax', {d['code'] for d in result['diagnostics']})

              def test_requirement_includes_do_not_satisfy_required_source_policy(self):
                  for directive in ('-r prod.txt', '-c constraints.txt', '--requirement=prod.txt', '--constraint constraints.txt', '-rprod.txt'):
                      with self.subTest(directive=directive):
                          result = self.collection({'requirements.txt': directive + '\n'}, required_sources=['requirements.txt'])
                          self.assertTrue(collection_errors(result))
                          self.assertIn('unresolved_requirement_include', {d['code'] for d in result['diagnostics']})
                          self.assertEqual('partial', next(d['status'] for d in result['discovery'] if d['file'] == 'requirements.txt'))
                          self.assertTrue(self.facts(result, kind='requirements-option'))

              def test_json_numeric_lexemes_survive_javascript_projection(self):
                  value = parse_json(b'{"large":9007199254740993,"fraction":0.12345678901234567890,"negative_zero":-0,"safe":42,"half":1.5}')
                  self.assertEqual({'$type': 'json-number', 'lexeme': '9007199254740993'}, value['large'])
                  self.assertEqual('0.12345678901234567890', value['fraction']['lexeme'])
                  self.assertEqual('-0', value['negative_zero']['lexeme'])
                  self.assertEqual(42, value['safe'])
                  self.assertEqual(1.5, value['half'])
                  wire = subprocess.run(['node', '-e', 'process.stdout.write(JSON.stringify(JSON.parse(require("node:fs").readFileSync(0,"utf8"))))'],
                      input=json.dumps(value), text=True, capture_output=True, check=True).stdout
                  self.assertEqual(value, json.loads(wire))
                  result = self.collection({'data.json': '{"large":9007199254740993}'})
                  self.assertFalse(collection_errors(result))
                  self.assertEqual('9007199254740993', self.facts(result, kind='structured-document')[0]['native']['value']['large']['lexeme'])

              def test_explicit_integral_yaml_float_is_already_supported(self):
                  value = parse_yaml(b'num: !!float 1\n')
                  self.assertIsInstance(value['num'], float)
                  self.assertEqual(1.0, value['num'])

              def test_local_typescript_exports_keep_aliases_and_type_only_standing(self):
                  source = 'function foo() {} function privateFn() {} type T = {x: number}; export {foo as renamed}; export type {T};'
                  result = self.collection({'a.ts': source})
                  self.assertFalse(collection_errors(result), result['diagnostics'])
                  exports = self.facts(result, kind='local-export')
                  self.assertEqual({'renamed', 'T'}, {f['native']['value']['exported_name'] for f in exports})
                  by_name = {f['native']['value']['exported_name']: f['native']['value'] for f in exports}
                  self.assertEqual('foo', by_name['renamed']['local_name'])
                  self.assertFalse(by_name['renamed']['type_only'])
                  self.assertTrue(by_name['T']['type_only'])
                  public = {f['native']['value']['name'] for f in self.facts(result, kind='exported-declaration')}
                  self.assertEqual({'foo', 'T'}, public)

              def test_ant_project_xml_is_not_maven(self):
                  source = '<project name="ant"><target name="x"><dependency><artifactId>not-maven</artifactId></dependency></target></project>'
                  result = self.collection({'build.xml': source})
                  self.assertFalse(collection_errors(result))
                  self.assertFalse(self.facts(result, 'maven.pom'))
                  self.assertTrue(self.facts(result, 'xml.document', 'structured-document'))

              def test_unnamespaced_pom_requires_model_version_discriminator(self):
                  source = '<project><modelVersion>4.0.0</modelVersion><dependencies><dependency><artifactId>demo</artifactId></dependency></dependencies></project>'
                  result = self.collection({'pom.xml': source})
                  self.assertFalse(collection_errors(result))
                  self.assertTrue(self.facts(result, 'maven.pom', 'dependency'))

              def test_svg_uses_same_no_dtd_utf8_boundary_as_other_xml(self):
                  source = '<?xml version="1.0" encoding="UTF-16"?><!DOCTYPE svg [<!ENTITY x "forbidden">]><svg><title>&x;</title></svg>'
                  result = self.collection({'bad.svg': source.encode('utf-16')})
                  self.assertTrue(collection_errors(result))
                  self.assertFalse(self.facts(result, 'svg.document-metadata'))
                  good = self.collection({'good.svg': '<svg xmlns="http://www.w3.org/2000/svg"><title>Safe</title></svg>'})
                  self.assertFalse(collection_errors(good))
                  self.assertEqual('Safe', self.facts(good, 'svg.document-metadata')[0]['native']['value']['title'])
          ''')
          baseline = subprocess.run([sys.executable, '-m', 'unittest', 'tests.test_native_review_regressions'], capture_output=True, text=True)
          print(baseline.stdout + baseline.stderr)
          assert baseline.returncode != 0 and 'FAILED' in baseline.stderr, 'review failures were not reproduced'

          replace('msdmd/formats.py', 'import json\n', 'import json\nfrom decimal import Decimal\n')
          replace('msdmd/formats.py', '''    def number(value: str) -> float:
                  result = float(value)
                  if not math.isfinite(result):
                      raise ValueError('JSON number exceeds finite numeric representation')
                  return result

              return check_tree(json.loads(data, object_pairs_hook=pairs, parse_constant=constant, parse_float=number))''', '''    def integer(value: str) -> Any:
                  result = int(value)
                  if abs(result) > 2 ** 53 - 1 or value == '-0':
                      return {'$type': 'json-number', 'lexeme': value}
                  return result

              def number(value: str) -> Any:
                  result = float(value)
                  if not math.isfinite(result):
                      raise ValueError('JSON number exceeds finite numeric representation')
                  original = Decimal(value)
                  if original != Decimal.from_float(result) or (result == 0 and original.is_signed()):
                      return {'$type': 'json-number', 'lexeme': value}
                  return result

              return check_tree(json.loads(data, object_pairs_hook=pairs, parse_constant=constant, parse_int=integer, parse_float=number))''')

          replace('msdmd/readers.py', 'from msdmd.formats import is_json_schema_uri, parse_json, parse_yaml\n', 'from msdmd.formats import is_json_schema_uri, parse_json, parse_yaml, parse_xml\n')
          helper = '''def _redact_systemd_environment(value: str) -> tuple[str, bool, bool]:
              """Redact every assignment in the supported, non-escaped word subset.

              Unknown quoting/escaping withholds the entire value rather than
              applying shell rules to systemd syntax or publishing possible secrets.
              """
              parts: list[str] = []
              position = 0
              redacted = False
              while position < len(value):
                  start = position
                  while position < len(value) and value[position].isspace():
                      position += 1
                  parts.append(value[start:position])
                  if position == len(value):
                      break
                  start = position
                  quote_char = value[position] if value[position] in (chr(34), chr(39)) else ''
                  if quote_char:
                      end = value.find(quote_char, position + 1)
                      if end < 0 or (end + 1 < len(value) and not value[end + 1].isspace()):
                          return '<redacted>', True, True
                      word = value[position + 1:end]
                      position = end + 1
                  else:
                      while position < len(value) and not value[position].isspace():
                          position += 1
                      word = value[start:position]
                      if chr(34) in word or chr(39) in word:
                          return '<redacted>', True, True
                  if chr(92) in word:
                      return '<redacted>', True, True
                  name, separator, assigned = word.partition('=')
                  if not separator or not re.fullmatch(r'[A-Za-z_][A-Za-z0-9_]*', name):
                      return '<redacted>', True, True
                  if _SENSITIVE_KEY_RE.search(name):
                      parts.append(quote_char + name + '=<redacted>' + quote_char)
                      redacted = True
                  else:
                      parts.append(value[start:position])
              return ''.join(parts), redacted, False


          '''
          replace('msdmd/readers.py', 'def _read_systemd(', helper + 'def _read_systemd(')
          replace('msdmd/readers.py', '        if not logical and (not stripped or stripped.startswith(("#", ";"))):\n', '        if not stripped or stripped.startswith(("#", ";")):\n')
          replace('msdmd/readers.py', '''        logical += raw.rstrip("\\\\").strip()
                  if raw.rstrip().endswith("\\\\"):
                      continue''', '''        if stripped.endswith(chr(92)):
                      logical += stripped[:-1] + ' '
                      continue
                  logical += stripped''')
          replace('msdmd/readers.py', '        key, value = line.split("=", 1)\n', '        key, value = (part.strip() for part in line.split("=", 1))\n')
          target = Path('msdmd/readers.py')
          text = target.read_text()
          start = text.index('        published_value = value\n', text.index('def _read_systemd('))
          end = text.index('        identity_key = (section, key)\n', start)
          text = text[:start] + '''        published_value = value
                  if key.lower() == 'environment':
                      published_value, redacted, unsupported = _redact_systemd_environment(value)
                      location = {'start_line': logical_start, 'end_line': number}
                      if redacted:
                          diagnostics.append(_diagnostic(context, reader_id=reader_id, code='sensitive_fields_redacted',
                              message='withheld potentially sensitive systemd Environment values', status='redacted', location=location))
                      if unsupported:
                          diagnostics.append(_diagnostic(context, reader_id=reader_id, code='unsupported_systemd_environment_syntax',
                              message='Environment quoting or escaping is outside the supported subset; value withheld', status='unsupported', location=location))
          ''' + text[end:]
          target.write_text(text)
          replace('msdmd/readers.py', '        if published.startswith("-"):\n', '''        if published.startswith("-"):
                      if published.startswith(('-r', '-c')) or re.match(r'^--(?:requirement|constraint)(?:[=\\s]|$)', published):
                          diagnostics.append(_diagnostic(context, reader_id=reader_id, code='unresolved_requirement_include',
                              message='included requirements/constraints are declared but not resolved', status='dynamic-unresolved',
                              location={'start_line': line_number, 'end_line': line_number}))
          ''')
          text = target.read_text()
          start = text.index('def _read_svg(')
          end = text.index('_LLMS_HEADING_RE =', start)
          text = text[:start] + '''def _read_svg(path: Path, data: bytes, context: dict[str, Any]) -> tuple[list[dict], list[dict], list[dict]]:
              reader_id = 'svg-metadata'
              context = dict(context, convention_version='SVG document subset v1', dialect='xml')
              try:
                  root = parse_xml(data)
              except (UnicodeDecodeError, ValueError, ET.ParseError) as exc:
                  return [], [], [_diagnostic(context, reader_id=reader_id, code='invalid_svg_xml',
                      message=type(exc).__name__ + '; SVG rejected by bounded XML parser', status='invalid', severity='error')]
              if root.tag.rsplit('}', 1)[-1] != 'svg':
                  return [], [], [_diagnostic(context, reader_id=reader_id, code='unexpected_svg_root',
                      message='expected svg root', status='invalid', severity='error')]
              title = None
              description = None
              for child in root:
                  child_name = child.tag.rsplit('}', 1)[-1]
                  if child_name == 'title' and title is None:
                      title = ''.join(child.itertext()).strip()
                  elif child_name == 'desc' and description is None:
                      description = ''.join(child.itertext()).strip()
              value = {'attributes': dict(root.attrib), 'title': title, 'description': description}
              return [_fact(context, reader_id=reader_id, kind='document-metadata', scope='document', identity=context['file'],
                  location={'pointer': '/svg'}, value=value, convention='svg.document-metadata')], [], []


          ''' + text[end:]
          target.write_text(text)

          replace('msdmd/collect.py', 'from msdmd.readers import READER_MANIFESTS, read_native\n', 'from msdmd.readers import READER_MANIFESTS, _redact_sensitive, read_native\n')
          replace('msdmd/collect.py', '            lines = [""] * len(text.split("\\n"))\n', '''            comments_available = any(f['kind'] == 'comment' and f['extraction']['reader_id'] in {'typescript-compiler', 'native-grammars'} for f in file_facts)
                      if not comments_available and file_statuses & {'unsupported', 'ambiguous', 'invalid'}:
                          candidates = []
                          for candidate_block in block_names:
                              for entry in parse_text(text, candidate_block, marker):
                                  candidate, _ = _redact_sensitive({'block': candidate_block, 'entry': entry})
                                  candidates.append(candidate)
                          if candidates:
                              diagnostics.append({'code': 'supplemental_comment_extraction_unavailable', 'severity': 'error', 'status': 'unsupported',
                                  'message': 'block-shaped candidates retained without certifying comment origin; install or select the native parser',
                                  'source': {'file': relative, 'content_sha256': item['content_sha256'], 'candidate_standing': 'unverified', 'candidate_blocks': candidates},
                                  'reader_id': 'msdmd-block'})
                      lines = [""] * len(text.split("\\n"))
          ''')

          replace('msdmd/typescript-reader.cjs', 'declarations: [], imports: [], docs:', 'declarations: [], imports: [], exports: [], docs:')
          replace('msdmd/typescript-reader.cjs', '''        declaration: text(node), owner, ...span(node)});
              }
            }''', '''        declaration: text(node), owner, ...span(node)});
              } else if (ts.isExportDeclaration(node) && node.exportClause && ts.isNamedExports(node.exportClause)) {
                for (const item of node.exportClause.elements) {
                  result.exports.push({kind: 'local-export', local_name: (item.propertyName || item.name).text,
                    exported_name: item.name.text, type_only: !!node.isTypeOnly || !!item.isTypeOnly,
                    declaration: text(node), owner, ...span(item)});
                }
              }
            }''')
          replace('msdmd/typescript-reader.cjs', 'visit(sf);\n', '''visit(sf);
          for (const binding of result.exports) {
            const qualified = qualify(binding.owner, binding.local_name);
            const declarations = result.declarations.filter(item => item.qualified_name === qualified);
            binding.declaration_identities = declarations.map(item => item.identity);
            for (const declaration of declarations) {
              declaration.exported = true;
              declaration.export_names = [...new Set([...(declaration.export_names || []), binding.exported_name])];
            }
          }
          ''')
          target = Path('msdmd/native_code.py')
          text = target.read_text()
          index = text.rindex('    return facts, edges, diagnostics\n')
          text = text[:index] + '''    for index, item in enumerate(parsed.get('exports', [])):
                  fact = _fact(context, reader_id=rid, kind='local-export', scope='module', identity=context['file'],
                      value=item, native_id=item['exported_name'], location={'start_line': item['start_line'], 'end_line': item['end_line']})
                  fact['address'] = fact['subject']['address'] + f'/fact/local-export/{index}'
                  facts.append(fact)
                  targets = [_subject_address(context, 'symbol', identity) for identity in item['declaration_identities']]
                  for target in targets or ['ecma-local:' + item['local_name']]:
                      edges.append(_edge(fact['subject']['address'], target, 'exports:' + item['exported_name']))
          ''' + text[index:]
          target.write_text(text)
          replace('msdmd/standards.py', "        convention = conventions.get(root_name, 'xml.document')\n", '''        convention = conventions.get(root_name, 'xml.document')
                  maven_namespace = 'http://maven.apache.org/POM/4.0.0'
                  maven_identity = root.tag == '{' + maven_namespace + '}project' or (root.tag == 'project' and
                      any(child.tag == 'modelVersion' and (child.text or '').strip() == '4.0.0' for child in root))
                  if convention == 'maven.pom' and not maven_identity:
                      convention = 'xml.document'
          ''')
          doc = Path('msdmd/references/implemented-readers.md')
          doc.write_text(doc.read_text() + '''
          ## Regression-qualified boundaries

          `tests/test_native_review_regressions.py` exercises these acceptance cases:

          - When a native comment parser is missing or ambiguous, block-shaped candidates survive in source-qualified diagnostics with unverified standing. They are not promoted to declarations; strict collection fails instead of silently dropping them.
          - JSON numeric values outside safe integer/exact binary64 representation use `{ "$type": "json-number", "lexeme": "..." }`, preserving the original numeric lexeme across TypeScript/JavaScript. Nonfinite overflow remains rejected. This is an explicit tagged representation, not a claim that JavaScript arithmetic is exact.
          - Systemd continuation backslashes become spaces and intervening comments are ignored. Environment assignments are checked individually. Plain words and whole-word quotes are supported; unimplemented escaping/quoting withholds the entire value and reports partial scope. No systemd expansion is executed.
          - Requirements include/constraint directives remain source-owned records and are explicitly unresolved; required-source coverage fails until their information obligation is satisfied.
          - TypeScript local export lists retain public aliases, type-only flags and source-local declaration links. Compiler/build-context resolution remains out of scope.
          - Maven XML recognition requires its POM namespace or an unnamespaced project with modelVersion 4.0.0. Other project XML stays generic XML.
          - SVG uses the same bounded, UTF-8, DTD/entity-rejecting parser as other XML inputs.
          - Explicit YAML `!!float 1` is supported and is a regression control, not an outstanding defect.
          ''')
          Path(temporary).unlink()
          PY
          python -m unittest tests.test_native_review_regressions
      - name: Recompute changed seals and collection
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path
          from ratios.ratios_check import COMPUTERS
          for name in ('collect.py', 'formats.py', 'readers.py', 'native_code.py', 'standards.py'):
              path = Path('msdmd') / name
              text = path.read_text()
              seal = '# ratios: ' + ' '.join(f'{key}={compute(text)}' for key, compute in COMPUTERS.items())
              path.write_text(re.sub(r'^# ratios:.*$', seal, text, flags=re.MULTILINE))
          PY
          python -m msdmd.collect --root . --repo The-Interdependency/skill-lib --snapshot-identity --import-path ./msdmd/collection --out skill-lib_msdmd.ts --strict
          python -m msdmd.collect --root . --repo The-Interdependency/skill-lib --snapshot-identity --import-path ./msdmd/collection --out skill-lib_msdmd.ts --strict --check
          node msdmd/node_modules/typescript/bin/tsc --noEmit --strict --skipLibCheck --target ES2022 --module commonjs msdmd/collection.ts skill-lib_msdmd.ts
      - name: Complete acceptance gates
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests
          bash tools/check_gonol_authority.sh
          python tools/check_skill_lib_drift.py --warnings-fail
          python tools/check_skill_compliance.py --warnings-fail
          python tools/build_codex_plugin_skills.py --check
          python ratios/ratios_check.py --strict
          python -m llms.build --root . --out llms.txt --check
          python tests/test_repo_loto.py --audit
          python -u tests/test_repo_loto.py
      - name: Publish only verified product files
        shell: bash
        run: |
          set -euo pipefail
          git add -- msdmd/collect.py msdmd/formats.py msdmd/readers.py msdmd/native_code.py msdmd/typescript-reader.cjs msdmd/standards.py msdmd/references/implemented-readers.md tests/test_native_review_regressions.py skill-lib_msdmd.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(msdmd): close reviewed disclosure fidelity and coverage gaps'
          git push origin HEAD:refs/heads/repair/msdmd-native-readers-20260928
