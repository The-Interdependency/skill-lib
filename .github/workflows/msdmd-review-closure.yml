name: MSDMD review closure
on:
  push:
    branches: [repair/msdmd-native-readers-20260928]
    paths: [.github/workflows/msdmd-review-closure.yml]
permissions:
  contents: write
jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
      - name: Guard exact input
        run: test "$(git rev-parse HEAD^)" = 2aac5fdcca22fe2ac4b9922e9927824904d578c0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: '24.15.0'
      - name: Install pinned reader runtimes
        run: |
          python -m pip install -r msdmd/requirements.txt
          npm ci --ignore-scripts --prefix msdmd
      - name: Apply authenticated one-shot repair
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, zlib
          # Transport encoding only. Exact generated repair source is hash-bound;
          # every resulting product source is committed in ordinary readable form.
          payload = ''
          # Correct transport-only transcription deltas; hash then verifies every byte.
          payload = payload.replace('7WpGeYY4E2', '7WpGeY4E2').replace('Pi5iujsV6bak', 'Pi5iujsV+bak')
          source = zlib.decompress(base64.b64decode(payload, validate=True))
          assert hashlib.sha256(source).hexdigest() == 'b1d255008a40d0b7d464556640041dec631400a2beb41a46908e1b0fcec36f54'
          exec(compile(source, '<msdmd-review-closure>', 'exec'))
          PY
          rm .github/workflows/msdmd-review-closure.yml
      - name: Regression and complete unit suite
        run: python -m unittest discover -s tests
      - name: Regenerate and verify unified collection
        run: |
          python -m msdmd.collect --root . --repo The-Interdependency/skill-lib --snapshot-identity --import-path ./msdmd/collection --out skill-lib_msdmd.ts --strict
          python -m msdmd.collect --root . --repo The-Interdependency/skill-lib --snapshot-identity --import-path ./msdmd/collection --out skill-lib_msdmd.ts --strict --check
          node msdmd/node_modules/typescript/bin/tsc --noEmit --strict --skipLibCheck --target ES2022 --module commonjs msdmd/collection.ts skill-lib_msdmd.ts
      - name: Full repository gates
        run: |
          bash tools/check_gonol_authority.sh
          python tools/check_skill_lib_drift.py --warnings-fail
          python tools/check_skill_compliance.py --warnings-fail
          python tools/build_codex_plugin_skills.py --check
          python ratios/ratios_check.py --strict
          python -m llms.build --root . --out llms.txt --check
          python tests/test_repo_loto.py --audit
          python tests/test_repo_loto.py
      - name: Commit verified product changes only
        env:
          TARGET_BRANCH: repair/msdmd-native-readers-20260928
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add msdmd/standards.py msdmd/native_code.py msdmd/readers.py msdmd/typescript-reader.cjs tests/test_native_review_closure.py skill-lib_msdmd.ts
          git commit -m 'fix(msdmd): close seven native-reader review defects with regressions'
          git push origin "HEAD:$TARGET_BRANCH"
          echo "PRODUCT_COMMIT=$(git rev-parse HEAD)"
          git add -u .github/workflows/msdmd-review-closure.yml
          echo "VALIDATED_FINAL_TREE=$(git write-tree)"
          sha256sum skill-lib_msdmd.ts
