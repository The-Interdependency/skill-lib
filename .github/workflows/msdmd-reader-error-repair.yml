# Temporary exact-base regression executor; removed after verified publication.
name: msdmd-reader-error-repair
on:
  push:
    branches: [repair/msdmd-native-readers-20260928]
    paths: [.github/workflows/msdmd-reader-error-repair.yml]
permissions:
  contents: write
jobs:
  repair-and-verify:
    if: github.repository == 'The-Interdependency/skill-lib' && github.ref == 'refs/heads/repair/msdmd-native-readers-20260928'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: '24.15.0'
      - name: Install declared parser runtimes
        run: |
          python -m pip install -r msdmd/requirements.txt
          npm ci --ignore-scripts --prefix msdmd
      - name: Reproduce exact failure then move preprocessing into diagnostic boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          import sys
          from pathlib import Path
          base = '7d09ae775c8ab992c6dd6fda181ad969629758ef'
          temporary = '.github/workflows/msdmd-reader-error-repair.yml'
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip() == base
          assert subprocess.check_output(['git', 'diff', '--name-only', base, 'HEAD'], text=True).splitlines() == [temporary]
          test = Path('tests/test_native_encoding_boundary.py')
          assert not test.exists()
          test.write_text('''"""Malformed-source regression: python -m unittest tests.test_native_encoding_boundary."""
          from pathlib import Path
          import tempfile
          import unittest

          from msdmd.collect import collect, collection_errors


          class NativeEncodingBoundaryTests(unittest.TestCase):
              def test_malformed_code_with_ratios_preserves_other_files_and_reports_error(self):
                  for suffix in ('.ts', '.rs', '.java', '.cpp', '.h'):
                      with self.subTest(suffix=suffix), tempfile.TemporaryDirectory() as temp:
                          root = Path(temp)
                          name = 'broken' + suffix
                          (root / name).write_bytes(b'// ratios: loc_comments=1:1 imports_exports=0:0 calls_definitions=0:0\\n\\xff')
                          (root / 'healthy.json').write_text('{"name":"preserved"}')
                          result = collect(root, 'fixture', source_commit='a' * 40)
                          self.assertTrue(collection_errors(result))
                          self.assertTrue(any(d['code'] == 'native_reader_error' and d['source']['file'] == name for d in result['diagnostics']))
                          self.assertEqual('invalid', next(d['status'] for d in result['discovery'] if d['file'] == name))
                          self.assertTrue(any(f['source']['file'] == 'healthy.json' and f['native']['value'].get('name') == 'preserved' for f in result['facts']))
          ''')
          baseline = subprocess.run([sys.executable, '-m', 'unittest', 'tests.test_native_encoding_boundary'], capture_output=True, text=True)
          print(baseline.stdout + baseline.stderr)
          assert baseline.returncode != 0 and 'UnicodeDecodeError' in baseline.stderr, 'expected original decoding failure was not reproduced'
          target = Path('msdmd/readers.py')
          text = target.read_text()
          start = text.index('        if reader_id == "msdmd-ratios" and path.suffix.lower()')
          end = text.index('        try:\n            reader_facts, reader_edges, reader_diagnostics = reader(', start)
          setup = text[start:end]
          text = text[:start] + '        try:\n' + ''.join('    ' + line for line in setup.splitlines(keepends=True)) + text[end + len('        try:\n'):]
          target.write_text(text)
          Path(temporary).unlink()
          PY
          python -m unittest tests.test_native_encoding_boundary
      - name: Recompute affected seal and collection
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path
          from ratios.ratios_check import COMPUTERS
          path = Path('msdmd/readers.py')
          text = path.read_text()
          seal = '# ratios: ' + ' '.join(f'{key}={compute(text)}' for key, compute in COMPUTERS.items())
          path.write_text(re.sub(r'^# ratios:.*$', seal, text, flags=re.MULTILINE))
          PY
          python -m msdmd.collect --root . --repo The-Interdependency/skill-lib --snapshot-identity --import-path ./msdmd/collection --out skill-lib_msdmd.ts --strict
          python -m msdmd.collect --root . --repo The-Interdependency/skill-lib --snapshot-identity --import-path ./msdmd/collection --out skill-lib_msdmd.ts --strict --check
          node msdmd/node_modules/typescript/bin/tsc --noEmit --strict --skipLibCheck --target ES2022 --module commonjs msdmd/collection.ts skill-lib_msdmd.ts
      - name: Replay complete acceptance gates
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests
          bash tools/check_gonol_authority.sh
          python tools/check_skill_lib_drift.py --warnings-fail
          python tools/check_skill_compliance.py --warnings-fail
          python tools/build_codex_plugin_skills.py --check
          python ratios/ratios_check.py --strict
          python -m llms.build --root . --out llms.txt --check
          python tests/test_repo_loto.py --audit
          python -u tests/test_repo_loto.py
      - name: Publish verified source changes
        shell: bash
        run: |
          set -euo pipefail
          git add -- msdmd/readers.py tests/test_native_encoding_boundary.py skill-lib_msdmd.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(msdmd): diagnose malformed code preprocessing without aborting collection'
          git push origin HEAD:refs/heads/repair/msdmd-native-readers-20260928
