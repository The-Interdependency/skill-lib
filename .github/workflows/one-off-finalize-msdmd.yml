name: one-off-finalize-msdmd

on:
  push:
    branches: [repair/adaptive-elicitation-reconcile]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: repair/adaptive-elicitation-reconcile
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v6
        with:
          node-version: "24.15.0"
      - name: Install pinned native-reader runtimes
        run: |
          python -m pip install -r msdmd/requirements.txt
          npm ci --ignore-scripts --prefix msdmd
      - name: Remove one-off workflow before snapshot
        run: rm .github/workflows/one-off-finalize-msdmd.yml
      - name: Regenerate against final intended tree
        run: python -m msdmd.collect --root . --repo The-Interdependency/skill-lib --snapshot-identity --import-path ./msdmd/collection --out skill-lib_msdmd.ts --strict
      - name: Commit final projection and self-removal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows/one-off-finalize-msdmd.yml skill-lib_msdmd.ts
          git commit -m "Finalize MSDMD projection for adaptive elicitation"
          git push origin HEAD:repair/adaptive-elicitation-reconcile
