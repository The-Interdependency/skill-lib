name: skill-lib-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v6
        with:
          node-version: "24.15.0"
      - name: Install pinned native-reader runtimes
        run: |
          python -m pip install -r msdmd/requirements.txt
          npm ci --ignore-scripts --prefix msdmd
      - name: Refresh canonical collection projection
        run: |
          printf '%s' '' | base64 -d > .github/workflows/ci.yml
          echo final_workflow_sha=$(sha256sum .github/workflows/ci.yml | cut -d' ' -f1)
          set +e
          python -m msdmd.collect --root . --repo The-Interdependency/skill-lib --snapshot-identity --import-path ./msdmd/collection --out skill-lib_msdmd.ts --strict
          collect_status=$?
          set -e
          echo collect_status=${collect_status}
          node msdmd/node_modules/typescript/bin/tsc --noEmit --strict --skipLibCheck --target ES2022 --module commonjs msdmd/collection.ts skill-lib_msdmd.ts
          cp skill-lib_msdmd.ts /tmp/skill-lib_msdmd.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "${GITHUB_HEAD_REF}:${GITHUB_HEAD_REF}"
          git checkout "${GITHUB_HEAD_REF}"
          cp /tmp/skill-lib_msdmd.ts skill-lib_msdmd.ts
          git add skill-lib_msdmd.ts
          if git diff --cached --quiet; then
            echo "collection already fresh"
          else
            git commit -m "chore(msdmd): refresh canonical collection projection"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
            echo "canonical collection refreshed; restore workflow next"
            exit 1
          fi
      - name: Unit tests
        run: python -m unittest discover -s tests
