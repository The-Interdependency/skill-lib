name: skill-lib-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v6
        with:
          node-version: "24.15.0"
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: Exact EDCM cross-source construction witness
        run: |
          EDCM_CHECKOUT=$(mktemp -d)
          git -C "$EDCM_CHECKOUT" init
          git -C "$EDCM_CHECKOUT" fetch --depth 1 https://github.com/The-Interdependency/edcm.git ddc89a97ebbcf0a5863dad6e633b01b520e9bccf
          git -C "$EDCM_CHECKOUT" checkout --detach FETCH_HEAD
          python tools/check_edcm_boundary.py "$EDCM_CHECKOUT"
      - name: Skill library drift
        run: python tools/check_skill_lib_drift.py --warnings-fail
      - name: Skill compliance
        run: python tools/check_skill_compliance.py --warnings-fail
      - name: Codex plugin adapter drift
        run: python tools/build_codex_plugin_skills.py --check
      - name: Ratios strict gate
        run: python ratios/ratios_check.py --strict
      - name: llms-build drift
        run: python -m llms.build --root . --out llms.txt --check
      - name: RepoLOTO audit
        run: python tests/test_repo_loto.py --audit
      - name: RepoLOTO checks
        run: python tests/test_repo_loto.py