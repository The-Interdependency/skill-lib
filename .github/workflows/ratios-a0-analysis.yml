name: ratios-a0-analysis

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair-and-analyze:
    if: github.head_ref == 'fix/ratios-named-seal-analysis'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.x"

      - name: Repair named-seal self-exclusion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys

          path = Path('ratios/annotate_index.py')
          text = path.read_text(encoding='utf-8')

          anchor = '_ANN_TS = re.compile(r"^//\\s*\\d+:\\d+(\\s+\\d+:\\d+){0,2}\\s*$")\n'
          addition = anchor + '_NAMED_ANN = re.compile(\n    r"^(?:#|//)\\s*ratios:\\s+"\n    r"loc_comments=(?:\\d+:\\d+|hmmm)\\s+"\n    r"imports_exports=(?:\\d+:\\d+|hmmm)\\s+"\n    r"calls_definitions=(?:\\d+:\\d+|hmmm)\\s*$"\n)\n'
          if anchor not in text:
              raise SystemExit('annotation-regex anchor not found')
          text = text.replace(anchor, addition, 1)

          anchor = '''def _is_seal(line: str, ext: str) -> bool:\n    s = line.strip()\n    return bool((_ANN_PY if ext == ".py" else _ANN_TS).match(s))\n\n\n'''
          addition = anchor + '''def _is_named_seal(line: str) -> bool:\n    """Return whether a line is the portable named RATIOS boundary seal."""\n    return bool(_NAMED_ANN.match(line.strip()))\n\n\n'''
          if anchor not in text:
              raise SystemExit('_is_seal anchor not found')
          text = text.replace(anchor, addition, 1)

          anchor = '''def _strip_seal(lines: list[str], ext: str) -> list[str]:\n    w = lines[:]\n    opening = _opening_index(w)\n    if len(w) > opening and _is_seal(w[opening], ext):\n        del w[opening]\n    closing = _last_nonblank_index(w)\n    if closing is not None and _is_seal(w[closing], ext):\n        del w[closing]\n    return w\n\n\n'''
          addition = anchor + '''def _strip_measurement_seals(lines: list[str], ext: str) -> list[str]:\n    """Exclude compact or named boundary seals from metric computation only."""\n    w = _strip_seal(lines, ext)\n    opening = _opening_index(w)\n    if len(w) > opening and _is_named_seal(w[opening]):\n        del w[opening]\n    closing = _last_nonblank_index(w)\n    if closing is not None and _is_named_seal(w[closing]):\n        del w[closing]\n    return w\n\n\n'''
          if anchor not in text:
              raise SystemExit('_strip_seal anchor not found')
          text = text.replace(anchor, addition, 1)

          old = '        working = _strip_seal(text.splitlines(), ext)\n'
          new = '        working = _strip_measurement_seals(text.splitlines(), ext)\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one build-index strip call, found {text.count(old)}')
          text = text.replace(old, new, 1)

          old = 'fan-in; it does not alter seal computation or invent absolute-import coverage.\n'
          new = ('fan-in; it does not alter seal computation or invent absolute-import coverage.\n'
                 'Metric computation self-excludes both compact canonical seals and portable named\n'
                 '`ratios:` bookends; canonical write/check placement remains compact-only.\n')
          if old not in text:
              raise SystemExit('docstring anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_annotate_index.py')
          tests = test_path.read_text(encoding='utf-8')
          anchor = '    def test_seal_line_format(self):\n'
          test = '''    def test_named_seals_self_exclude_without_becoming_compact_seals(self):\n        with tempfile.TemporaryDirectory() as tmp:\n            td = Path(tmp)\n            py_seal = "# ratios: loc_comments=2:1 imports_exports=0:1 calls_definitions=0:1"\n            ts_seal = "// ratios: loc_comments=1:1 imports_exports=0:1 calls_definitions=0:0"\n            py = td / "named.py"\n            ts = td / "named.ts"\n            py.write_text(\n                py_seal + "\\n\\"\\"\\"doc.\\"\\"\\"\\ndef public():\\n    return 1\\n" + py_seal + "\\n",\n                encoding="utf-8",\n            )\n            ts.write_text(\n                ts_seal + "\\n// doc\\nexport const value = 1;\\n" + ts_seal + "\\n",\n                encoding="utf-8",\n            )\n\n            idx = A.build_index(A.collect_files(td), td)\n            self.assertEqual((idx[str(py)]["code"], idx[str(py)]["comment"]), (2, 1))\n            self.assertEqual((idx[str(ts)]["code"], idx[str(ts)]["comment"]), (1, 1))\n            self.assertTrue(A._is_named_seal(py_seal))\n            self.assertTrue(A._is_named_seal(ts_seal))\n            self.assertFalse(A._is_seal(py_seal, ".py"))\n            self.assertFalse(A._is_seal(ts_seal, ".ts"))\n\n'''
          if anchor not in tests:
              raise SystemExit('test insertion anchor not found')
          tests = tests.replace(anchor, test + anchor, 1)
          test_path.write_text(tests, encoding='utf-8')

          sys.path.insert(0, str(Path('ratios').resolve()))
          import ratios_check as R

          def restamp(filename: str) -> None:
              p = Path(filename)
              content = p.read_text(encoding='utf-8')
              line = (
                  '# ratios: '
                  f'loc_comments={R.compute_loc_comments(content)} '
                  f'imports_exports={R.compute_imports_exports(content)} '
                  f'calls_definitions={R.compute_calls_definitions(content)}'
              )
              lines = content.splitlines()
              opening = 1 if lines and lines[0].startswith('#!') else 0
              if ' ratios:' not in lines[opening]:
                  raise SystemExit(f'missing opening named seal: {filename}')
              lines[opening] = line
              closing = max(i for i, value in enumerate(lines) if value.strip())
              if ' ratios:' not in lines[closing]:
                  raise SystemExit(f'missing closing named seal: {filename}')
              lines[closing] = line
              p.write_text('\n'.join(lines) + '\n', encoding='utf-8')
              print(f'restamped {filename}: {line}')

          restamp('ratios/annotate_index.py')
          restamp('tests/test_annotate_index.py')
          PY

          python -m unittest tests.test_annotate_index tests.test_harmonics
          python ratios/ratios_check.py ratios/annotate_index.py
          python ratios/ratios_check.py tests/test_annotate_index.py

      - name: Checkout exact a0 specimen
        uses: actions/checkout@v7.0.1
        with:
          repository: The-Interdependency/a0
          ref: 9a58c3fc9526735fdf9a596f19810c5198565ddc
          path: a0-target

      - name: Analyze a0 structural harmonics
        shell: bash
        run: |
          python - <<'PY'
          from collections import deque
          from pathlib import Path
          import json
          import math
          import random
          import sys

          root = Path('a0-target').resolve()
          sys.path.insert(0, str(Path('ratios').resolve()))
          sys.path.insert(0, str(Path('.').resolve()))

          import annotate_index as A
          import harmonics as H
          import harmonic_math as HM

          PERMUTATIONS = 199
          MAX_EIGEN_NODES = 128
          SIGNALS = (
              'code', 'comment', 'consumed', 'declared', 'fan_in', 'fan_out',
              'nm_contrast', 'cd_contrast', 'io_contrast',
          )

          files = A.collect_files(root)
          index = A.build_index(files, root)
          import_evidence = A.build_import_graph(files)
          semantic_evidence = H.semantic_file_graph(
              H._load_semantic_collection(root, 'a0'), root, index.keys()
          )
          domains = {
              'import': import_evidence['adjacency'],
              'semantic': semantic_evidence['adjacency'],
          }

          def graph_for(adjacency, nodes):
              return HM.undirected_graph(adjacency, nodes)

          def components(adjacency, nodes):
              graph = graph_for(adjacency, nodes)
              remaining = set(node for node in nodes if graph.get(node))
              out = []
              while remaining:
                  start = min(remaining)
                  seen = {start}
                  queue = deque([start])
                  while queue:
                      node = queue.popleft()
                      for neighbor in graph.get(node, ()):
                          if neighbor in remaining and neighbor not in seen:
                              seen.add(neighbor)
                              queue.append(neighbor)
                  remaining -= seen
                  out.append(sorted(seen))
              return sorted(out, key=lambda comp: (-len(comp), comp[0] if comp else ''))

          def basis_for(adjacency, nodes, cache, key):
              cache_key = (key, tuple(nodes))
              if cache_key in cache:
                  return cache[cache_key]
              graph = graph_for(adjacency, nodes)
              lap = HM._laplacian(nodes, graph)
              values, vectors = HM._jacobi_eigh(lap)
              groups = HM._eigen_groups(values)
              nonzero = [group for group in groups if sum(values[i] for i in group) / len(group) > 1e-9]
              cache[cache_key] = (values, vectors, nonzero)
              return cache[cache_key]

          def graph_family(adjacency, signal, domain_name, cache, seed):
              comps = components(adjacency, signal.keys())
              if not comps:
                  return {'status': 'hmmm', 'reason': 'no component with an edge'}
              nodes = comps[0]
              if len(nodes) < 4:
                  return {'status': 'hmmm', 'reason': f'largest component has {len(nodes)} nodes'}
              if len(nodes) > MAX_EIGEN_NODES:
                  return {
                      'status': 'hmmm',
                      'reason': f'largest component has {len(nodes)} nodes > resource guard {MAX_EIGEN_NODES}',
                      'component_size': len(nodes),
                  }
              values, vectors, groups = basis_for(adjacency, nodes, cache, domain_name)
              y = [float(signal[node]) for node in nodes]
              mean = sum(y) / len(y)
              centered = [v - mean for v in y]
              total = sum(v * v for v in centered)
              if total <= 0:
                  return {'status': 'hmmm', 'reason': 'signal constant on largest component', 'component_size': len(nodes)}

              def spectrum(values_y):
                  return [
                      sum(HM._dot(values_y, vectors[i]) ** 2 for i in group) / total
                      for group in groups
                  ]

              observed = spectrum(centered)
              observed_max = max(observed)
              top_i = max(range(len(observed)), key=observed.__getitem__)
              rng = random.Random(seed)
              shuffled = centered[:]
              exceed = 0
              for _ in range(PERMUTATIONS):
                  rng.shuffle(shuffled)
                  if max(spectrum(shuffled)) >= observed_max - 1e-15:
                      exceed += 1
              group = groups[top_i]
              eigenvalue = sum(values[i] for i in group) / len(group)
              return {
                  'status': 'ok',
                  'component_size': len(nodes),
                  'component_count': len(comps),
                  'top_energy_fraction': observed_max,
                  'family_p': (exceed + 1.0) / (PERMUTATIONS + 1.0),
                  'top_eigenvalue': eigenvalue,
                  'top_graph_frequency': math.sqrt(max(0.0, eigenvalue)),
                  'top_multiplicity': len(group),
                  'anchor_candidates': sorted(nodes, key=lambda n: (-len(graph_for(adjacency, nodes)[n]), n))[:3],
              }

          def distances(adjacency, nodes, anchor):
              graph = graph_for(adjacency, nodes)
              out = {anchor: 0}
              queue = deque([anchor])
              while queue:
                  node = queue.popleft()
                  for neighbor in graph.get(node, ()):
                      if neighbor not in out:
                          out[neighbor] = out[node] + 1
                          queue.append(neighbor)
              return out, graph

          def scalar_family(adjacency, signal, seed):
              comps = components(adjacency, signal.keys())
              if not comps or len(comps[0]) < 4:
                  return {'status': 'hmmm', 'reason': 'no component with at least four signal nodes'}
              nodes = comps[0]
              graph = graph_for(adjacency, nodes)
              anchor = sorted(nodes, key=lambda n: (-len(graph[n]), n))[0]
              dist, _ = distances(adjacency, nodes, anchor)
              x = [float(dist[n]) for n in nodes]
              y = [float(signal[n]) for n in nodes]
              span = max(x) - min(x)
              if span < 2 or max(y) == min(y):
                  return {'status': 'hmmm', 'reason': 'distance span/signal insufficient', 'anchor': str(Path(anchor).relative_to(root))}
              harmonics = list(range(1, max(1, min(12, int(span) // 2)) + 1))
              observed = [HM._sinusoid_power(x, y, 2.0 * math.pi * k / span) for k in harmonics]
              observed_max = max(observed)
              top_i = max(range(len(observed)), key=observed.__getitem__)
              rng = random.Random(seed)
              shuffled = y[:]
              exceed = 0
              for _ in range(PERMUTATIONS):
                  rng.shuffle(shuffled)
                  null_max = max(
                      HM._sinusoid_power(x, shuffled, 2.0 * math.pi * k / span)
                      for k in harmonics
                  )
                  if null_max >= observed_max - 1e-15:
                      exceed += 1
              return {
                  'status': 'ok',
                  'component_size': len(nodes),
                  'anchor': str(Path(anchor).relative_to(root)),
                  'max_distance': int(span),
                  'tested_harmonics': harmonics,
                  'top_harmonic': harmonics[top_i],
                  'top_power': observed_max,
                  'family_p': (exceed + 1.0) / (PERMUTATIONS + 1.0),
              }

          preflight = {}
          all_nodes = list(index.keys())
          for name, adjacency in domains.items():
              comps = components(adjacency, all_nodes)
              directed_edges = sum(len(v) for v in adjacency.values())
              preflight[name] = {
                  'directed_edges': directed_edges,
                  'active_nodes': sum(len(comp) for comp in comps),
                  'component_sizes': [len(comp) for comp in comps[:12]],
              }
          preflight['files'] = len(files)
          preflight['import_unresolved'] = len(import_evidence['unresolved'])
          preflight['import_ambiguous'] = len(import_evidence['ambiguous'])
          preflight['semantic_resolved_edges'] = semantic_evidence['resolved_edges']
          preflight['semantic_unresolved_edges'] = len(semantic_evidence['unresolved_edges'])

          cache = {}
          results = {}
          for signal_name in SIGNALS:
              signal, omitted = H.metric_signal(index, signal_name)
              record = {'omitted': len(omitted)}
              for domain_name, adjacency in domains.items():
                  record[domain_name] = graph_family(
                      adjacency, signal, domain_name, cache,
                      seed=1000 + SIGNALS.index(signal_name) * 10 + (0 if domain_name == 'import' else 1),
                  )
                  record[f'{domain_name}_distance'] = scalar_family(
                      adjacency, signal,
                      seed=2000 + SIGNALS.index(signal_name) * 10 + (0 if domain_name == 'import' else 1),
                  )
              results[signal_name] = record

          survival = []
          for signal_name, record in results.items():
              passed = []
              for domain_name in ('import', 'semantic', 'import_distance', 'semantic_distance'):
                  item = record[domain_name]
                  if item.get('status') == 'ok' and item.get('family_p', 1.0) <= 0.05:
                      passed.append(domain_name)
              if len(passed) >= 2:
                  survival.append({'signal': signal_name, 'domains_p_le_0.05': passed})

          report = {
              'specimen': {'repo': 'The-Interdependency/a0', 'commit': '9a58c3fc9526735fdf9a596f19810c5198565ddc'},
              'method': {
                  'permutations': PERMUTATIONS,
                  'family_test': 'maximum non-zero eigenspace energy / maximum scalar harmonic power',
                  'distance_anchor': 'highest undirected degree, lexical tie-break',
                  'max_eigen_nodes': MAX_EIGEN_NODES,
              },
              'preflight': preflight,
              'results': results,
              'cross_domain_survival': survival,
          }
          Path('a0-harmonics-analysis.json').write_text(json.dumps(report, indent=2), encoding='utf-8')
          print('=== A0_HARMONICS_ANALYSIS_BEGIN ===')
          print(json.dumps(report, indent=2))
          print('=== A0_HARMONICS_ANALYSIS_END ===')
          PY

      - name: Commit repaired counter and regression
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ratios/annotate_index.py tests/test_annotate_index.py
          git commit -m "fix(ratios): self-exclude named seals from canonical counts"
          git push origin HEAD:${{ github.head_ref }}
